<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>كلية علوم الحاسوب والرياضيات</title>
<style>
:root{color-scheme:dark;--bg:#0f1218;--card:#181c26;--text:#e8ebf2;--muted:#9aa3b5;--accent:#6b95ff;--line:#2a3040;--head:#222a3c}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:960px;margin:0 auto;padding:0 14px 40px}
h1{font-size:1.4rem;margin:0}
.brand{display:flex;align-items:center;gap:10px;margin:4px 0 2px}
.logo{width:46px;height:46px;flex:none;background:none;border:0;display:block}
@media (max-width:600px){h1{font-size:1.15rem}.logo{width:40px;height:40px}th,td{padding:9px 7px;font-size:.88rem}}
.sub{color:var(--muted);margin:0 0 6px;font-size:.95rem}
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.search{padding:6px 0 0}
input{width:100%;padding:14px 16px;font-size:1.05rem;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);outline:none}
input::placeholder{color:var(--muted)}
input:focus{border-color:var(--accent)}
.count{color:var(--muted);font-size:.9rem;margin:6px 2px 0}
.tablebox{margin-top:12px}
.tablebox{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 10px;font-size:.95rem;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
td.name{white-space:nowrap}
th{background:var(--head)}
tbody tr:hover{background:var(--head)}
tr:last-child td{border-bottom:none}
.num{font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--head);font-size:.85rem}
.empty{padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
